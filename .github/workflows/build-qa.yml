name: Build QA APK

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-qa-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # change to 'yarn' or 'pnpm' if applicable

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      # Build Debug APK (uses standard debug keystore out-of-the-box)
      - name: Build QA Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      # Upload Artifact to GitHub Actions for testers to download
      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-qa.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
