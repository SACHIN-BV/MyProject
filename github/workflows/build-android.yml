name: Build Android QA (APK) & Production (AAB)

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-js-version: '20'
          cache: 'npm' # or 'yarn' / 'pnpm' depending on your setup

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Decode Keystore (Production)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      # Step 1: Build QA APK (Debug or Release)
      - name: Build QA APK
        run: |
          cd android
          ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 && 'release.keystore' || '' }}
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Step 2: Build Production AAB
      - name: Build Production AAB
        run: |
          cd android
          ./gradlew bundleRelease
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 && 'release.keystore' || '' }}
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Upload Artifacts
      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: qa-app-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Upload Production AAB
        uses: actions/upload-artifact@v4
        with:
          name: prod-app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30